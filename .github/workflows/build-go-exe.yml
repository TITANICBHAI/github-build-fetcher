name: Build Go Windows executable

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: go-app

jobs:
  build-windows:
    name: Test and build Windows executable
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache-dependency-path: go-app/go.mod

      - name: Run Go tests
        run: go test ./...

      - name: Build portable Windows executable
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          go build \
            -trimpath \
            -buildvcs=false \
            -ldflags="-s -w" \
            -o GitHubFetcher.exe .

      - name: Verify executable
        shell: bash
        run: |
          test -s GitHubFetcher.exe
          file GitHubFetcher.exe

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: GitHubFetcher-windows-amd64
          path: go-app/GitHubFetcher.exe
          if-no-files-found: error
          retention-days: 30